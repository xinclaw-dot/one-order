name: Deploy Frontend (Cloudflare Pages)

# Dijalankan manual lewat tab "Actions" di GitHub -> pilih workflow ini -> "Run workflow"
on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "Nama project Cloudflare Pages (project harus sudah dibuat lebih dulu di dashboard Cloudflare / via wrangler CLI)"
        required: true
        default: "simpel-kitchen"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (npm run build)
        run: npm run build

      - name: Deploy ke Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=${{ inputs.project_name }}
